name: Model startup

# Boots each registered model from the CLI and cagets every PV it publishes,
# to catch regressions where a model builds but fails to serve its variables.

on:
  pull_request:
  workflow_dispatch:

jobs:
  startup:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # n-particles=10 keeps the sim quick without changing which PVs are
          # published; omit it for backends that do not sample a count
          # (bmad single stages, zfel). end-ele=TD11 on the cu_hxr chains
          # avoids a downstream particle-loss datum (orbit.x[142]).
          - model: impact_cu_inj
            args: "--n-particles 10"
          - model: bmad_cu_hxr
            args: ""
          - model: surrogate_cu_inj
            args: "--n-particles 10"
          - model: cheetah_cu_hxr
            args: "--n-particles 10"
          - model: zfel_cu_hxr
            args: ""
          - model: impact_f2e_inj
            args: "--n-particles 10"
          - model: surrogate_f2e_inj
            args: "--n-particles 10"
          - model: bmad_f2_elec
            args: ""
          - model: high_fidelity_cu_hxr_s2e
            args: "--n-particles 10 --end-ele TD11"
          - model: fast_cu_hxr_s2e
            args: "--n-particles 10 --end-ele TD11"
          - model: high_fidelity_facet2_s2e
            args: "--n-particles 10"
          - model: fast_facet2_s2e
            args: "--n-particles 10"
    defaults:
      run:
        shell: bash -el {0}
    env:
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_ADDR_LIST: "127.0.0.1:5064"
      EPICS_CA_CONN_TMO: "30"
      EPICS_CA_MAX_ARRAY_BYTES: "16777216"
      EPICS_CA_REPEATER_PORT: "5065"
      EPICS_CA_BEACON_PERIOD: "15"
      LCLS_LATTICE: ${{ github.workspace }}/lcls-lattice
      FACET2_LATTICE: ${{ github.workspace }}/facet2-lattice
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e
        with:
          fetch-depth: 1

      - name: Checkout lattice repos
        uses: ./.github/actions/checkout-lattices

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@6bd9d14c76e9fc5223db3dd28e004f2c458599e8
        with:
          miniforge-version: latest
          python-version: "3.13"
          channels: conda-forge
          channel-priority: strict
          activate-environment: va-env

      - name: Install pytao (includes bmad)
        run: conda install -y "pytao>=1"

      - name: Install IMPACT-T solver
        run: conda install -y -c conda-forge "impact-t=*=nompi*"

      - name: Install CPU-only PyTorch
        run: pip install --upgrade --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package with all extras
        run: pip install ".[all,dev]"

      - name: Install EPICS CA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends epics-base
          # caRepeater ships with epics-base but may not be on PATH.
          CAREPEATER_PATH="$(dpkg -L epics-base | grep '/caRepeater$' | head -n1 || true)"
          if [[ -n "$CAREPEATER_PATH" ]]; then
            echo "$(dirname "$CAREPEATER_PATH")" >> "$GITHUB_PATH"
          fi

      - name: List installed packages
        run: pip list

      - name: Dump PVs the model publishes
        run: |
          python -m virtual_accelerator.models.runners \
            "${{ matrix.model }}" ${{ matrix.args }} --list-pvs \
            > "$RUNNER_TEMP/pvs.txt"
          wc -l "$RUNNER_TEMP/pvs.txt"
          if [[ ! -s "$RUNNER_TEMP/pvs.txt" ]]; then
            echo "No PVs reported by ${{ matrix.model }}" >&2
            exit 1
          fi

      - name: Start virtual accelerator
        run: |
          python -m virtual_accelerator.models.runners \
            "${{ matrix.model }}" ${{ matrix.args }} --log-level=DEBUG \
            > "$RUNNER_TEMP/va.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/va.pid"

      - name: Wait for EPICS readiness
        run: |
          set -e
          READY_PV="$(head -n1 "$RUNNER_TEMP/pvs.txt")"
          cat > "$RUNNER_TEMP/check_va.py" <<PY
          import os, pathlib, sys, time, epics
          pv_name = "$READY_PV"
          timeout_s = 60
          print(f"Checking EPICS readiness for {pv_name} (timeout={timeout_s}s)", flush=True)
          for attempt in range(1, timeout_s + 1):
              pv = epics.get_pv(pv_name, auto_monitor=False)
              if pv.wait_for_connection(timeout=1.0):
                  print(f"Connected to {pv_name} on attempt {attempt}", flush=True)
                  sys.exit(0)
              if attempt == 1 or attempt % 5 == 0:
                  print(f"Waiting... attempt {attempt}/{timeout_s}", flush=True)
              time.sleep(1)
          print(f"Timed out waiting for {pv_name}", flush=True)
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "va.log"
          if log.exists():
              print("--- last 200 lines of va.log ---", flush=True)
              print("\n".join(log.read_text(errors="replace").splitlines()[-200:]), flush=True)
          sys.exit(1)
          PY
          python "$RUNNER_TEMP/check_va.py"

      - name: caget every published PV
        run: |
          set -u
          FAIL="$RUNNER_TEMP/caget_failures.txt"
          : > "$FAIL"
          mapfile -t PVS < "$RUNNER_TEMP/pvs.txt"
          echo "Checking ${#PVS[@]} PVs individually..."
          CHECKED=0
          for pv in "${PVS[@]}"; do
            OUTPUT="$(caget -w 10 "$pv" 2>&1 || true)"
            if echo "$OUTPUT" | grep -qE 'disconnected|Channel connect timed out|Timeout|not found'; then
              echo "$pv: $OUTPUT" >> "$FAIL"
            fi
            CHECKED=$((CHECKED + 1))
            if (( CHECKED % 500 == 0 )); then
              echo "  ... $CHECKED / ${#PVS[@]}"
            fi
          done
          if [[ -s "$FAIL" ]]; then
            FAIL_COUNT=$(wc -l < "$FAIL")
            echo "::error::$FAIL_COUNT PV(s) failed to connect"
            echo "First 50 failures:"
            head -n 50 "$FAIL"
            exit 1
          fi
          echo "All ${#PVS[@]} PVs reachable."

      - name: Stop virtual accelerator
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/va.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/va.pid")" 2>/dev/null || true
          fi

      - name: Upload debug artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: va-startup-${{ matrix.model }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/va.log
            ${{ runner.temp }}/pvs.txt
            ${{ runner.temp }}/caget_failures.txt
            ${{ github.workspace }}/*.h5
            ${{ github.workspace }}/*.yaml
            ${{ github.workspace }}/*.yml
            ${{ github.workspace }}/*.log
